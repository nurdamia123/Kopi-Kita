<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Kopi Kita customers - loyalty members, spending and order history.">
  <meta name="keywords" content="Kopi Kita, cafe, ordering, sales, customers, loyalty">
  <meta name="author" content="Nur Damia Izzati Binti Hassan (2025124987)">
  <meta name="theme-color" content="#7a5235">
  <meta name="robots" content="index, follow">
  <!-- Open Graph: how the page looks when the link is shared -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Kopi Kita">
  <meta property="og:title" content="Customers | Kopi Kita">
  <meta property="og:description" content="Kopi Kita customers - loyalty members, spending and order history.">
  <title>Customers | Kopi Kita</title>
  <link rel="icon" type="image/svg+xml" href="brand/app-icon.svg">
  <link rel="apple-touch-icon" href="brand/app-icon.svg">
  <!-- Apply the saved light/dark mode before the page draws (no white flash) -->
  <script>try { document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('kk_theme') || 'light'); } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="customers" data-protected>
  <!-- Shared sidebar, top bar and footer are added by js/app.js -->
  <div id="kk-sidebar"></div>
  <div class="kk-main d-flex flex-column min-vh-100">
    <div id="kk-topbar"></div>
    <main class="kk-content flex-grow-1" id="main">

      <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-4">
        <div><h1 class="page-title">Customers</h1><p class="page-sub">Loyalty members. 1 point for every RM1 spent. Click a customer for the full profile.</p></div>
        <div class="d-flex flex-wrap gap-2"><button class="btn btn-light" id="btnExport"><i class="bi bi-download me-1"></i>Export CSV</button></div>
      </div>

      <section class="row g-3 mb-3" id="kpiRow"></section>
      <section class="row g-3 mb-3">
        <div class="col-md-6 col-lg-4"><div class="kk-card h-100 ">
            <div class="card-header-kk"><span>Members by tier</span><span class="kk-hint">Click to filter</span></div>
            <div class="card-body-kk"><div class="chart-box sm"><canvas id="tierChart" role="img" aria-label="chart"></canvas></div></div>
          </div></div>
        <div class="col-md-6 col-lg-4"><div class="kk-card h-100 ">
            <div class="card-header-kk"><span>New members per month</span></div>
            <div class="card-body-kk"><div class="chart-box sm"><canvas id="joinChart" role="img" aria-label="chart"></canvas></div></div>
          </div></div>
        <div class="col-lg-4"><div class="kk-card h-100 ">
            <div class="card-header-kk"><span>Members by area</span></div>
            <div class="card-body-kk"><div class="chart-box sm"><canvas id="areaChart" role="img" aria-label="chart"></canvas></div></div>
          </div></div>
        <div class="col-12"><div class="kk-card h-100 ">
            <div class="card-header-kk"><span>Top 10 customers by spending</span><span class="kk-hint">Click a bar</span></div>
            <div class="card-body-kk"><div class="chart-box "><canvas id="topChart" role="img" aria-label="chart"></canvas></div></div>
          </div></div>
      </section>

      <section class="kk-card">
        <div class="card-body-kk border-bottom"><div class="row g-2">
          <div class="col-12 col-md-6"><input type="search" class="form-control" id="cSearch" placeholder="Search name, email or area..." aria-label="Search customers"></div>
          <div class="col-6 col-md-3"><select class="form-select" id="cTier" aria-label="Tier"><option value="">All tiers</option><option>Gold</option><option>Silver</option><option>Bronze</option></select></div>
          <div class="col-6 col-md-3"><select class="form-select" id="cSort" aria-label="Sort"><option value="spend">Highest spending</option><option value="visits">Most visits</option><option value="recent">Recent visit</option><option value="name">Name A-Z</option></select></div>
        </div></div>
        <div class="table-responsive"><table class="table kk-table table-hover">
          <thead><tr><th>Customer</th><th class="d-none d-md-table-cell">Area</th><th class="text-center d-none d-sm-table-cell">Visits</th><th class="text-end">Spend</th><th class="text-end d-none d-lg-table-cell">Points</th><th>Tier</th><th class="d-none d-lg-table-cell">Last visit</th></tr></thead>
          <tbody id="custBody"></tbody></table></div>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 p-3">
          <small class="kk-muted" id="custInfo"></small><ul class="pagination pagination-sm mb-0" id="custPager"></ul></div>
      </section>
    </main>
    <div id="kk-footer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/customers.js"></script>
</body>
</html>

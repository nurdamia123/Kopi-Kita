<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Kopi Kita menu - drinks, pastries, food and desserts with prices.">
  <meta name="keywords" content="Kopi Kita, cafe, ordering, sales, menu">
  <meta name="author" content="Nur Damia Izzati Binti Hassan (2025124987)">
  <meta name="theme-color" content="#7a5235">
  <meta name="robots" content="index, follow">
  <!-- Open Graph: how the page looks when the link is shared -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Kopi Kita">
  <meta property="og:title" content="Menu | Kopi Kita">
  <meta property="og:description" content="Kopi Kita menu - drinks, pastries, food and desserts with prices.">
  <title>Menu | Kopi Kita</title>
  <link rel="icon" type="image/svg+xml" href="brand/app-icon.svg">
  <link rel="apple-touch-icon" href="brand/app-icon.svg">
  <!-- Apply the saved light/dark mode before the page draws (no white flash) -->
  <script>try { document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('kk_theme') || 'light'); } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="menu" data-protected>
  <!-- Shared sidebar, top bar and footer are added by js/app.js -->
  <div id="kk-sidebar"></div>
  <div class="kk-main d-flex flex-column min-vh-100">
    <div id="kk-topbar"></div>
    <main class="kk-content flex-grow-1" id="main">

      <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-4">
        <div><h1 class="page-title">Menu</h1><p class="page-sub">All drinks and food sold at Kopi Kita. Click an item to see its sales.</p></div>
        <div class="d-flex flex-wrap gap-2"><button class="btn btn-primary" id="btnAdd"><i class="bi bi-plus-lg me-1"></i>Add item</button></div>
      </div>

      <section class="row g-3 mb-3" id="kpiRow"></section>
      <section class="row g-3 mb-3">
        <div class="col-lg-5"><div class="kk-card h-100 ">
            <div class="card-header-kk"><span>Units sold by category</span></div>
            <div class="card-body-kk"><div class="chart-box sm"><canvas id="catChart" role="img" aria-label="chart"></canvas></div></div>
          </div></div>
        <div class="col-lg-7"><div class="kk-card h-100 ">
            <div class="card-header-kk"><span>Top 10 items by revenue</span><span class="kk-hint">Click a bar</span></div>
            <div class="card-body-kk"><div class="chart-box sm"><canvas id="topChart" role="img" aria-label="chart"></canvas></div></div>
          </div></div>
      </section>

      <section class="kk-card p-3 mb-3">
        <div class="row g-2 align-items-center">
          <div class="col-12 col-lg-6"><div class="pill-group" id="catPills" role="group" aria-label="Category filter"></div></div>
          <div class="col-7 col-lg-3"><input type="search" class="form-control" id="mSearch" placeholder="Search menu..." aria-label="Search menu"></div>
          <div class="col-5 col-lg-3"><select class="form-select" id="mSort" aria-label="Sort">
            <option value="popular">Most popular</option><option value="priceAsc">Price: low to high</option>
            <option value="priceDesc">Price: high to low</option><option value="rating">Top rated</option><option value="name">Name A-Z</option></select></div>
        </div>
      </section>
      <section class="row g-3" id="menuGrid" aria-live="polite"></section>
    </main>
    <div id="kk-footer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/menu.js"></script>
</body>
</html>
